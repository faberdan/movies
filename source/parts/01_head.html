<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faber Film Archive</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --card:#ffffff; --card-hover:#fafafa;
  --hairline:rgba(0,0,0,.07); --hairline-strong:rgba(0,0,0,.13);
  --ink:#1d1d1f; --ink-2:#55555a; --ink-3:#98989d;
  --gold:#a37f22; --gold-bg:rgba(176,138,46,.10);
  --accent:#2563eb; --accent-bg:rgba(37,99,235,.08);
  --good:#1e8e3e; --warn:#b06000; --bad:#c5221f;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 4px 12px rgba(0,0,0,.08),0 16px 40px rgba(0,0,0,.10);
  --g-browse:linear-gradient(135deg,#3b82f6,#1d4ed8);
  --g-coll:linear-gradient(135deg,#8b5cf6,#6d28d9);
  --g-dash:linear-gradient(135deg,#10b981,#047857);
  --g-nim:linear-gradient(135deg,#f59e0b,#d97706);
  --c-browse:#2563eb; --c-coll:#7c3aed; --c-dash:#059669; --c-nim:#d97706;
  --radius:14px; --radius-sm:10px;
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --sidebar-w:230px; --sidebar-w-c:64px;
}
[data-theme="dark"]{
  --bg:#0d0d0f; --surface:#161619; --card:#1b1b1f; --card-hover:#222227;
  --hairline:rgba(255,255,255,.08); --hairline-strong:rgba(255,255,255,.15);
  --ink:#f5f5f7; --ink-2:#b5b5ba; --ink-3:#7c7c82;
  --gold:#d3ab4e; --gold-bg:rgba(211,171,78,.13);
  --accent:#5b96f0; --accent-bg:rgba(91,150,240,.13);
  --good:#5dbb75; --warn:#e0a04c; --bad:#e07a77;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.45);
  --c-browse:#5b96f0; --c-coll:#a78bfa; --c-dash:#34d399; --c-nim:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--hairline);display:flex;flex-direction:column;padding:18px 12px 14px;z-index:60;transition:width .22s ease,transform .25s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;white-space:nowrap;overflow:hidden}
.brand .mark{flex:none;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3f3f46,#18181b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.02em}
[data-theme="dark"] .brand .mark{background:linear-gradient(135deg,#e4e4e7,#a1a1aa);color:#18181b}
.brand .name{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.navlinks{display:flex;flex-direction:column;gap:2px}
.navlinks a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden}
.navlinks a svg{flex:none;width:18px;height:18px}
.navlinks a:hover{background:var(--bg);color:var(--ink)}
.navlinks a.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sidebar .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.sidebar .foot button{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-align:left}
.sidebar .foot button svg{flex:none;width:18px;height:18px}
.sidebar .foot button:hover{background:var(--bg);color:var(--ink)}
body.nav-collapsed .sidebar{width:var(--sidebar-w-c)}
body.nav-collapsed .sidebar .name,body.nav-collapsed .sidebar .label{display:none}
body.nav-collapsed .navlinks a,body.nav-collapsed .sidebar .foot button{justify-content:center;padding:10px 0}
body.nav-collapsed .shell{margin-left:var(--sidebar-w-c)}
.shell{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .22s ease}
.scrim{display:none}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w) !important}
  body.nav-open .sidebar{transform:none;box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar .name,body.nav-open .sidebar .label{display:inline}
  body.nav-open .navlinks a,body.nav-open .sidebar .foot button{justify-content:flex-start;padding:10px 11px}
  .shell{margin-left:0 !important}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--hairline)}
@media(max-width:640px){.topbar{padding:10px 16px}}
.btn-menu{display:none;padding:7px;border-radius:8px;color:var(--ink-2)}
.btn-menu:hover{background:var(--surface)}
@media(max-width:900px){.btn-menu{display:flex}}
.topbar .spacer{flex:1}
.nav-search{position:relative}
.nav-search input{width:min(340px,52vw);background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:9px 14px 9px 36px;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.nav-search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3.5px var(--accent-bg)}
.nav-search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:flex}
.nav-search kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--ink-3);border:1px solid var(--hairline);border-radius:4px;padding:1px 5px;font-family:var(--font-ui)}
.suggest{position:absolute;top:calc(100% + 8px);right:0;width:min(420px,88vw);background:var(--card);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:70;text-align:left;max-height:430px;overflow-y:auto}
.suggest a{display:flex;align-items:center;gap:12px;padding:9px 14px}
.suggest a:hover,.suggest a.sel{background:var(--bg)}
.suggest .s-thumb{width:32px;height:48px;border-radius:5px;object-fit:cover;background:var(--bg);flex:none}
.suggest .s-thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;font-weight:600}
.suggest .s-title{font-weight:600;font-size:14px}
.suggest .s-meta{color:var(--ink-3);font-size:12.5px}
.suggest .s-more{padding:11px 14px;display:block;text-align:center;color:var(--accent);font-size:13.5px;font-weight:600;border-top:1px solid var(--hairline)}

main{flex:1;padding-bottom:72px}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 16px}}
h1.page-title{font-size:23px;font-weight:600;letter-spacing:-.015em;margin:30px 0 22px;color:var(--ink-2)}
h1.page-title.g-browse,.gtext.g-browse{background:var(--g-browse);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;width:max-content;max-width:100%}
h1.page-title.g-coll,.gtext.g-coll{background:var(--g-coll);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;width:max-content;max-width:100%}
h1.page-title.g-dash,.gtext.g-dash{background:var(--g-dash);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;width:max-content;max-width:100%}
h1.page-title.g-nim,.gtext.g-nim{background:var(--g-nim);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;width:max-content;max-width:100%}

/* ---------- home hub ---------- */
.hub{padding-top:34px}
.hub-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.hub-tiles{grid-template-columns:1fr}}
.hub-tile{border-radius:20px;padding:28px 26px;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
@media(max-width:900px){.hub-tile{min-height:240px}}
.hub-tile:hover{transform:translateY(-3px)}
.hub-tile.t-browse{background:var(--g-browse);box-shadow:0 10px 30px rgba(37,99,235,.28)}
.hub-tile.t-coll{background:var(--g-coll);box-shadow:0 10px 30px rgba(109,40,217,.28)}
.hub-tile.t-dash{background:var(--g-dash);box-shadow:0 10px 30px rgba(4,120,87,.28)}
.hub-tile.t-nim{background:var(--g-nim);box-shadow:0 10px 30px rgba(217,119,6,.28)}
.hub-tile svg{width:30px;height:30px;opacity:.9;margin-bottom:auto}
.hub-tile .t{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
[data-theme="dark"] .hub-tile{box-shadow:none}

/* ---------- rows/sections ---------- */
.section{margin-top:40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.section-head h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.section-head a.more{color:var(--accent);font-size:13.5px;font-weight:600;white-space:nowrap}
.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:164px;gap:16px;overflow-x:auto;padding:4px 4px 14px;scrollbar-width:thin}
@media(max-width:640px){.row-scroll{grid-auto-columns:134px}}

/* ---------- movie cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:18px;padding:4px}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:13px}}
.mcard{display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--hairline);box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .16s,box-shadow .16s;position:relative}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.poster{aspect-ratio:2/3;background:var(--bg);position:relative;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.poster-ph{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px;background:linear-gradient(160deg,#3a3a40 0%,#1d1d21 75%)}
.poster.badged .poster-ph{padding-top:42px}
.poster-ph .ph-title{font-size:15.5px;font-weight:600;line-height:1.25;color:#f2f1ec;overflow-wrap:break-word;letter-spacing:-.01em}
.poster-ph .ph-year{color:#c9a44a;font-size:12.5px;letter-spacing:.1em}
.poster-ph .ph-rule{width:26px;height:2px;background:#c9a44a;margin-top:9px;opacity:.75}
.badge-fav{position:absolute;top:8px;right:8px;background:rgba(20,20,22,.7);border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center;color:#e8c15c;font-size:13px;backdrop-filter:blur(4px)}
.badge-award{position:absolute;top:8px;left:8px;background:rgba(20,20,22,.72);color:#e8c15c;font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:3px 7px;backdrop-filter:blur(4px)}
.mcard-body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.mcard .t{font-weight:600;font-size:13.5px;line-height:1.3;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .m{color:var(--ink-3);font-size:11.8px;display:flex;gap:6px;flex-wrap:wrap}
.ratings{display:flex;gap:9px;margin-top:auto;padding-top:5px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.ratings span{display:inline-flex;align-items:center;gap:3.5px;white-space:nowrap}
.ratings .k{font-weight:700;color:var(--ink-3);font-size:9.5px}
.status-dot{font-size:11.5px;font-weight:600;margin-top:2px}
.status-dot.watched{color:var(--good)}
.status-dot.upnext{color:var(--accent)}
.status-dot.later{color:var(--warn)}
.status-dot.notgonna{color:var(--bad)}
.status-dot.none{color:var(--ink-3);font-weight:500}

/* ---------- browse filter bar ---------- */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filter-bar .spacer{flex:1}
.filter-bar select{background:var(--surface);border:1px solid var(--hairline);border-radius:9px;padding:8px 10px;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hairline);border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.dd-btn:hover{color:var(--ink);border-color:var(--hairline-strong)}
.dd-btn.has{background:var(--accent);border-color:var(--accent);color:#fff}
.dd-btn .dd-n{background:rgba(255,255,255,.28);border-radius:10px;padding:0 7px;font-size:11.5px;line-height:17px}
.dd-btn .dd-car{font-size:9px;opacity:.65}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:45;min-width:210px;max-width:290px;background:var(--card);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;max-height:320px;overflow-y:auto}
.dd-opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.dd-opt:hover{background:var(--bg);color:var(--ink)}
.dd-opt.on{color:var(--accent);font-weight:600}
.dd-opt .chk{flex:none;width:17px;height:17px;border-radius:5px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--hairline-strong);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.dd-opt.on .chk{background:var(--accent);box-shadow:none}
.dd-search{width:calc(100% - 8px);margin:4px;background:var(--bg);border:1px solid var(--hairline);border-radius:8px;padding:7px 10px;font-size:13px}
.dd-slider{padding:8px 10px}
.dd-slider label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.dd-slider input{width:150px;accent-color:var(--accent);vertical-align:middle}
.dd-slider .rv{font-size:12.5px;color:var(--ink-2);margin-left:8px;font-variant-numeric:tabular-nums}
.fav-toggle.has{background:#e0426d;border-color:#e0426d}

/* ---------- browse ---------- */
.browse-layout{display:grid;grid-template-columns:258px 1fr;gap:26px;align-items:start}
@media(max-width:900px){.browse-layout{grid-template-columns:1fr}}
.filters{position:sticky;top:74px;max-height:calc(100vh - 94px);overflow-y:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:18px;scrollbar-width:thin}
@media(max-width:900px){.filters{position:static;max-height:none;display:none}.filters.open{display:block}}
.filters h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:18px 0 8px;font-weight:600}
.filters h3:first-child{margin-top:0}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-size:12.5px;padding:5.5px 11px;border-radius:8px;background:var(--bg);color:var(--ink-2);cursor:pointer;font-weight:500}
.fchip:hover{color:var(--ink);background:var(--card-hover);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.fchip.on{background:var(--accent);color:#fff;font-weight:600}
.filters select,.filters input[type=text]{width:100%;background:var(--bg);border:1px solid var(--hairline);border-radius:8px;padding:7px 10px;font-size:13px}
.filters input[type=range]{width:100%;accent-color:var(--accent)}
.range-val{font-size:12px;color:var(--ink-2);margin-top:3px}
.btn-clear{width:100%;margin-top:18px;padding:9px;border-radius:9px;background:var(--bg);color:var(--ink-2);font-size:13px;font-weight:600}
.btn-clear:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.browse-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.browse-top .count{color:var(--ink-2);font-size:14px}
.browse-top .spacer{flex:1}
.browse-top select{background:var(--surface);border:1px solid var(--hairline);border-radius:9px;padding:8px 10px;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.btn-filter-toggle{display:none;background:var(--surface);border:1px solid var(--hairline);border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600}
@media(max-width:900px){.btn-filter-toggle{display:block}}
.active-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.achip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--accent-bg);color:var(--accent);border-radius:8px;padding:5px 7px 5px 11px}
.achip button{color:var(--accent);font-size:13px;line-height:1;padding:0 3px;opacity:.75}
.achip button:hover{opacity:1}
.achip.clearall{background:var(--bg);color:var(--ink-2);cursor:pointer;padding:5px 11px}
.empty{padding:70px 20px;text-align:center;color:var(--ink-2)}
.empty .big{font-size:19px;font-weight:600;color:var(--ink);margin-bottom:8px}

/* ---------- detail ---------- */
.detail-hero{display:grid;grid-template-columns:290px 1fr;gap:38px;margin-top:32px;align-items:start}
@media(max-width:760px){.detail-hero{grid-template-columns:1fr;gap:24px}.detail-hero .poster-col{max-width:250px}}
.poster-col .poster{border-radius:var(--radius);box-shadow:var(--shadow-lg)}
.d-title{font-size:clamp(25px,3.5vw,33px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.d-title .yr{color:var(--ink-3);font-weight:500;font-size:.6em;margin-left:10px}
.d-meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);margin:10px 0 4px;font-size:14.5px}
.d-meta b{color:var(--ink);font-weight:600}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pill{font-size:12.5px;font-weight:600;padding:5.5px 12px;border-radius:8px;background:var(--bg);color:var(--ink-2)}
a.pill:hover{background:var(--accent-bg);color:var(--accent)}
.pill.gold{background:var(--gold-bg);color:var(--gold)}
.score-row{display:flex;gap:12px;margin:18px 0;flex-wrap:wrap}
.score{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:10px 16px;min-width:90px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.score .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.score .l{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-top:1px;font-weight:600}
.d-summary{color:var(--ink-2);max-width:70ch;margin:14px 0;font-size:15.5px;line-height:1.6}
.d-actions{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;background:var(--bg);color:var(--ink)}
.btn:hover{background:var(--card-hover);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.85;box-shadow:none}
.personal-box{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:15px 18px;margin:18px 0;display:flex;gap:12px 32px;flex-wrap:wrap}
.personal-box .pi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.personal-box .pi .v{font-weight:600;margin-top:2px;font-size:14px}
.awards-box{margin-top:36px}
.awards-box h2,.subsec h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:14px}
.award-banner{display:flex;align-items:center;gap:12px;background:var(--gold-bg);border-radius:var(--radius);padding:13px 18px;margin-bottom:12px}
.award-banner .tro{font-size:20px}
.award-banner b{color:var(--gold)}
.award-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.award-cols{grid-template-columns:1fr}}
.award-list{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);padding:16px 18px}
.award-list h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:10px;font-weight:600}
.award-list h4 .n{color:var(--gold)}
.award-list ul{list-style:none}
.award-list li{padding:5.5px 0;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.award-list li .res{font-size:11px;font-weight:700;letter-spacing:.05em}
.res.won{color:var(--gold)}
.res.nom{color:var(--ink-3)}
.subsec{margin-top:38px}
.cast-row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.cast-chip{flex:none;width:102px;text-align:center}
.cast-chip .av{width:82px;height:82px;border-radius:50%;object-fit:cover;margin:0 auto 7px;background:var(--bg)}
.cast-chip .av.ph{display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--ink-3);font-weight:600}
.cast-chip .nm{font-size:12.5px;font-weight:600;line-height:1.25}
.cast-chip .ch{font-size:11.5px;color:var(--ink-3);line-height:1.25;margin-top:1px}
.cast-chip:hover .nm{color:var(--accent)}
.backlink{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13.5px;margin-top:26px;font-weight:500}
.backlink:hover{color:var(--accent)}
.note{color:var(--ink-3);font-size:12.5px;margin-top:14px;max-width:80ch}

/* ---------- collections ---------- */
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:6px}
.coll-card{border-radius:var(--radius);padding:22px 20px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;color:#fff;transition:transform .16s;position:relative;overflow:hidden}
.coll-card:hover{transform:translateY(-2px)}
.coll-card svg{width:20px;height:20px;opacity:.85;margin-bottom:auto}
.coll-card .t{font-weight:700;font-size:16px;letter-spacing:-.01em}
.coll-group-title{font-size:14px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;margin:32px 0 12px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;margin:6px 0 8px}
.kpi{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.02em}
.kpi .v .sm{font-size:14px;color:var(--ink-3);font-weight:600}
.kpi .l{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-top:3px;font-weight:600}
.kpi.gold .v{color:var(--gold)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media(max-width:800px){.charts{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);padding:18px 20px 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chart-card h3{font-size:14.5px;font-weight:600;margin-bottom:14px}
.bars-h .brow{display:grid;grid-template-columns:112px 1fr 40px;align-items:center;gap:10px;padding:3.5px 0}
.bars-h .blabel{font-size:12.5px;color:var(--ink-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars-h .btrack{height:14px;border-radius:4px}
.bars-h .bfill{height:100%;border-radius:4px;background:var(--c-dash);min-width:2px;opacity:.85}
.bars-h .bval{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bars-h .brow:hover .bfill{opacity:1}
.vbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.vbar .vfill{width:100%;max-width:42px;background:var(--c-dash);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.vbar:hover .vfill{opacity:1}
.vbar .vl{font-size:10.5px;color:var(--ink-3);margin-top:6px;white-space:nowrap}
.vbar .vv{font-size:11px;color:var(--ink-2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.chart-note{color:var(--ink-3);font-size:12.5px;margin-top:12px}

/* ---------- not in master ---------- */
.tabs{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:9px;background:var(--surface);border:1px solid var(--hairline);color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer}
.tab.on{background:var(--c-nim);border-color:var(--c-nim);color:#fff}
.nim-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.nim-item{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);padding:14px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.nim-item .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.nim-item .t{font-weight:600;font-size:15px}
.nim-item .y{color:var(--ink-3)}
.nim-item .sum{color:var(--ink-2);font-size:13.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nim-item .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.about-block{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);padding:22px 26px;margin-top:16px;max-width:86ch;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.about-block h3{font-size:15.5px;font-weight:600;margin-bottom:10px}
.about-block p{color:var(--ink-2);margin-bottom:10px}
.about-block p:last-child{margin-bottom:0}
.about-block table{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0}
.about-block td{padding:6px 10px;border-bottom:1px solid var(--hairline);color:var(--ink-2)}
.about-block td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.about-block a{color:var(--accent);font-weight:600}
.skeleton{opacity:.55}
</style>
</head>
